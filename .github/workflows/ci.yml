name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore AuditLogService.slnx

      - name: Format check
        run: dotnet format AuditLogService.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build AuditLogService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AuditLogService.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
